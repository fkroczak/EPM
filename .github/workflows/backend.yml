# EPM – Backend prüfen: bei jedem Push Tests gegen echtes PostgreSQL 18.
# Fehlen Migrationen für geänderte Modelle, werden sie hier erzeugt und ins Repo übernommen.
name: EPM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests mit PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: epm
          POSTGRES_USER: epm
          POSTGRES_PASSWORD: epm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U epm -d epm"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DJANGO_SECRET_KEY: nur-fuer-ci-tests
      DB_HOST: localhost
      DB_PASSWORD: epm
      DJANGO_ALLOWED_HOSTS: localhost,testserver
      EPM_DOKUMENTE: /tmp/epm-dokumente
      EPM_SCANS: /tmp/epm-scans
      # Scans (F160 ff.): Tesseract mit dem deutschen Modell aus dem Repo, PP-OCRv5 aus dem Zwischenspeicher – beide Pflicht
      EPM_TESSDATA: /tmp/tessdata
      EPM_OCR_MODELLE: /home/runner/ocr-modelle
      # „Text erkennen“ in der Akte (F170): OCRmyPDF und Ghostscript müssen im Test bereitstehen
      EPM_OCRMYPDF_PFLICHT: "1"
      EPM_OCR_PADDLE_PFLICHT: "1"
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Systembibliotheken für die PDF-Erzeugung und die Texterkennung
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-ibm-plex fonts-dejavu-core poppler-utils tesseract-ocr tesseract-ocr-osd ghostscript >/dev/null
          mkdir -p /tmp/tessdata
          cp scans/modelle/tesseract/deu.traineddata /tmp/tessdata/
          cp /usr/share/tesseract-ocr/5/tessdata/osd.traineddata /tmp/tessdata/
          TESSDATA_PREFIX=/tmp/tessdata tesseract --list-langs

      - name: Modelle der zweiten Texterkennung (Zwischenspeicher)
        uses: actions/cache@v4
        with:
          path: /home/runner/ocr-modelle
          key: ocr-modelle-${{ hashFiles('backend/scans/modelle/modelle.json') }}

      - name: Modelle laden und prüfen
        run: python scans/modelle/holen.py /home/runner/ocr-modelle

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt && pip freeze > /tmp/versionen.txt

      - name: Migrationen erzeugen, falls Modelle geändert wurden
        id: mig
        run: |
          set -o pipefail
          python manage.py makemigrations --noinput accounts stammdaten patienten infusionen befunde berichte vorlagen audit system altimport hilfe scans diktate faelle 2>&1 | tee -a ci-protokoll.txt
          if [ -n "$(git status --porcelain -- '*/migrations/*.py')" ]; then
            echo "neu=1" >> "$GITHUB_OUTPUT"
            git status --porcelain -- '*/migrations/*.py'
          fi

      - name: Neue Migrationen ins Repo übernehmen
        if: steps.mig.outputs.neu == '1' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "epm-ci"
          git config user.email "epm-ci@users.noreply.github.com"
          git add -- '*/migrations/*.py'
          git commit -m "Migrationen automatisch erzeugt (CI)"
          git push

      - name: Migrationen vollständig
        run: |
          set -o pipefail
          python manage.py makemigrations --check --dry-run 2>&1 | tee -a ci-protokoll.txt

      - name: Django-Prüfung
        run: |
          set -o pipefail
          python manage.py check 2>&1 | tee -a ci-protokoll.txt

      - name: Tests gegen PostgreSQL
        run: |
          set -o pipefail
          python manage.py test --verbosity 2 2>&1 | tee test-ausgabe.txt

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "### Backend-Tests"
            echo '```'
            grep -v " WARNING django.request: " test-ausgabe.txt | tail -60 || true
            echo '```'
            echo "<details><summary>Paketversionen</summary>"
            echo
            echo '```'
            cat /tmp/versionen.txt || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ergebnis als Kommentar am Commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # bei einem Pull Request am letzten Commit des Branches (github.sha wäre der Merge-Commit)
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "**Backend-Tests: ${{ job.status }}** (Lauf ${{ github.run_id }}${{ github.event_name == 'pull_request' && format(', Pull Request #{0}', github.event.number) || '' }})"
            echo
            echo '```'
            if [ -s test-ausgabe.txt ]; then
              grep -v " WARNING django.request: " test-ausgabe.txt | tail -c 55000
            else
              echo "keine Testausgabe – Protokoll der Vorbereitung:"
              tail -c 55000 ci-protokoll.txt 2>/dev/null || true
            fi
            echo '```'
            echo
            echo "<details><summary>Migrationen und Django-Prüfung</summary>"
            echo
            echo '```'
            head -c 4000 ci-protokoll.txt 2>/dev/null || true
            echo '```'
            echo "</details>"
          } > kommentar.md
          gh api "repos/${{ github.repository }}/commits/$COMMIT/comments" -F body=@kommentar.md > /dev/null

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-ausgabe
          path: backend/test-ausgabe.txt

  frontend:
    name: Frontend bauen und im Browser testen (echter Stack)
    runs-on: ubuntu-24.04
    needs: tests
    if: ${{ !cancelled() }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # nach einem Push den neuesten Stand von main (inkl. Migrationen, die der Test-Job gerade erzeugt hat)
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Abhängigkeiten (Lockfile erzeugen bzw. bei neuen Paketen ergänzen)
        id: npm
        working-directory: frontend
        run: |
          set -o pipefail
          if [ ! -f package-lock.json ]; then
            npm install --no-audit --no-fund 2>&1 | tee -a ../frontend-bau.txt
            echo "lock=1" >> "$GITHUB_OUTPUT"
          else
            # neue Abhängigkeit in package.json: Lockfile ergänzen, bestehende Versionen bleiben fest
            npm install --package-lock-only --no-audit --no-fund 2>&1 | tail -3 | tee -a ../frontend-bau.txt
            if ! git diff --quiet -- package-lock.json; then echo "lock=1" >> "$GITHUB_OUTPUT"; fi
          fi
          npm ci --no-audit --no-fund 2>&1 | tail -5 | tee -a ../frontend-bau.txt

      - name: Lockfile ins Repo übernehmen
        if: steps.npm.outputs.lock == '1' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "epm-ci"
          git config user.email "epm-ci@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Frontend: package-lock.json erzeugt/aktualisiert (CI)"
          git pull --rebase
          git push

      - name: Typen prüfen und bauen
        working-directory: frontend
        env:
          NO_COLOR: "1"
        run: |
          rc=0
          npm run build > ../bau-roh.txt 2>&1 || rc=$?
          grep -v "dist/assets/" ../bau-roh.txt | tee -a ../frontend-bau.txt
          exit $rc

      - name: Programme für Sicherung und Übertragung (GnuPG, rclone, jq)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnupg rclone jq > /dev/null && rclone version | head -1

      - name: Stack starten (Images bauen, Musterdaten, Testkonten)
        run: |
          set -o pipefail
          werkzeuge/ci-stack.sh start 2>&1 | tee stack.txt

      - name: Browser installieren
        working-directory: frontend
        run: npx playwright install --with-deps chromium > /dev/null

      - name: Browsertests
        working-directory: frontend
        env:
          EPM_CI_BASIS: /tmp/epm-ci
          # beim manuellen Start folgen Bildschirmfotos mit Musterdaten – dann die Datenbank nicht leeren
          EPM_OHNE_LEEREN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee ../e2e-ausgabe.txt

      - name: Bildschirmfotos (nur bei manuellem Start) in den Branch „bildschirmfotos“
        if: success() && github.event_name == 'workflow_dispatch'
        working-directory: frontend
        env:
          EPM_BILDER: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          # Testkonten neu (die Anmeldung vor jedem Lauf verbraucht Notfall-Codes)
          (cd /tmp/epm-ci && sudo docker compose -p epm-ci exec -T backend python manage.py shell) < e2e/vorbereiten.py
          npx playwright test e2e/bildschirmfotos.spec.ts e2e/bildschirmfotos-mobil.spec.ts 2>&1 | tail -5
          ziel="$(mktemp -d)"
          cp e2e/bildschirmfotos/*.png "$ziel/"
          cd "$ziel"
          git init -q -b bildschirmfotos
          git config user.name "epm-ci"
          git config user.email "epm-ci@users.noreply.github.com"
          git add . && git commit -q -m "Bildschirmfotos von ${GITHUB_REF_NAME} (${GITHUB_SHA::7}, Lauf ${GITHUB_RUN_ID})"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push -q -f "https://github.com/${GITHUB_REPOSITORY}.git" bildschirmfotos

      - name: Protokolle des Stacks
        if: failure()
        run: |
          werkzeuge/ci-stack.sh protokoll > audit.txt 2>&1 || true
          werkzeuge/ci-stack.sh logs > stack-logs.txt 2>&1 || true

      - name: Ergebnis als Kommentar am Commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ende() { [ -s "$2" ] && tail -c "$1" "$2" | iconv -f utf-8 -t utf-8 -c || true; }
          {
            echo "**Frontend und Browsertests: ${{ job.status }}** (Lauf ${{ github.run_id }})"
            echo
            if [ -s e2e-ausgabe.txt ]; then
              echo '```'; ende 40000 e2e-ausgabe.txt; echo '```'
            fi
            if [ "${{ job.status }}" != "success" ]; then
              echo "<details><summary>Bau</summary>"; echo; echo '```'; ende 12000 frontend-bau.txt; echo '```'; echo "</details>"
              echo "<details><summary>Stack</summary>"; echo; echo '```'; ende 2000 stack.txt; echo; ende 4000 stack-logs.txt; echo '```'; echo "</details>"
            fi
          } > kommentar.md
          senden() { head -c 64000 "$1" | iconv -f utf-8 -t utf-8 -c > "$1.kurz" || true
                     gh api "repos/${{ github.repository }}/commits/$COMMIT/comments" -F body=@"$1.kurz" > /dev/null; }
          senden kommentar.md
          if [ "${{ job.status }}" != "success" ]; then
            # Seitenzustand beim Fehler (error-context.md je Test) – zeigt ohne Artefakt-Download, was die Oberfläche anzeigte
            if ls frontend/test-results/*/error-context.md > /dev/null 2>&1; then
              {
                echo "**Seitenzustand der fehlgeschlagenen Browsertests** (Lauf ${{ github.run_id }})"
                for f in frontend/test-results/*/error-context.md; do
                  echo; echo "<details><summary>$(basename "$(dirname "$f")")</summary>"; echo; echo '```'
                  # ohne die Seitenleiste (immer gleich) – sonst reicht der Platz nicht bis zum Inhalt der Seite
                  if grep -q -- '- main' "$f"; then
                    { sed -n '1,/^# Page snapshot/p' "$f"; sed -n '/^# Page snapshot/,$p' "$f" | sed -n '/- main/,$p'; } \
                      | head -c 14000 | iconv -f utf-8 -t utf-8 -c || true
                  else
                    head -c 14000 "$f" | iconv -f utf-8 -t utf-8 -c || true
                  fi
                  echo; echo '```'; echo "</details>"
                done
              } > kontext.md
              senden kontext.md
            fi
            if [ -s audit.txt ]; then
              { echo "**Audit-Log, abgewiesene Anfragen, Fehler im Backend** (Lauf ${{ github.run_id }})"; echo; echo '```'
                head -c 62000 audit.txt | iconv -f utf-8 -t utf-8 -c || true; echo '```'; } > audit.md
              senden audit.md
            fi
          fi

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-ergebnisse
          path: frontend/test-results/
          if-no-files-found: ignore
