# EPM – Betrieb: Datenbank, Backend (Django), Texterkennung (OCR-Dienst), Webserver (Nginx)
# Aktivieren: in .env  COMPOSE_FILE=compose.yaml
name: epm

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: epm
      POSTGRES_USER: epm
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      TZ: Europe/Berlin
    secrets: [db_password]
    volumes:
      - db-data:/var/lib/postgresql
    networks: [intern]
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epm -d epm"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    image: epm-backend:${EPM_VERSION}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    user: "10001:101"                    # Gruppe 101 = Nginx, darf Dokumente lesen
    env_file: backend.env
    environment:
      DB_HOST: db
      DB_NAME: epm
      DB_USER: epm
      DB_PASSWORD_FILE: /run/secrets/db_password
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      EPM_DOKUMENTE: /data/dokumente
      EPM_LOESCHLISTE: /data/loeschliste/loeschliste.jsonl
      EPM_SYSTEM: /data/system
      EPM_IMPORT: /data/import
      EPM_SCANS: /data/scans
      EPM_VERSION: ${EPM_VERSION}
      TZ: Europe/Berlin
    secrets: [db_password, django_secret_key]
    volumes:
      - ./data/dokumente:/data/dokumente
      # Menüpunkt „Scans“: hochgeladene Scans bis zur Zuordnung (nicht in der Sicherung – sie laufen nach Tagen ab)
      - ./data/scans:/data/scans
      - ./data/loeschliste:/data/loeschliste   # Art. 17 DSGVO: übersteht eine Wiederherstellung
      # Übernahme der Altdaten (Administration › Import): Dokumente des Altsystems unter data/import/PatData/, nur lesen
      - ./data/import:/data/import:ro
      # Administration › System: Aufträge an den Systemagenten (schreiben), dessen Status (nur lesen)
      - ./system/auftraege:/data/system/auftraege
      - ./system/status:/data/system/status:ro
      # Administration › Backup: zum Herunterladen bereitgestellte Sicherungen (nur lesen; legt der Systemagent hin)
      # und hochgeladene (schreiben; der Systemagent liest sie ein)
      - ./system/download:/data/system/download:ro
      - ./system/upload:/data/system/upload
      - static:/app/staticfiles
    networks: [intern]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  ocr:
    # Texterkennung für „Scans“ (gleiches Image wie das Backend): Tesseract + PP-OCRv5 lokal, ohne Netz nach außen.
    # Arbeitet einen Scan nach dem anderen ab (niedrige Priorität) und löscht abgelaufene Scans stündlich.
    image: epm-backend:${EPM_VERSION}
    command: ["ocr"]
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    user: "10001:101"
    env_file: backend.env
    environment:
      DB_HOST: db
      DB_NAME: epm
      DB_USER: epm
      DB_PASSWORD_FILE: /run/secrets/db_password
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      EPM_DOKUMENTE: /data/dokumente
      EPM_SCANS: /data/scans
      EPM_OCR_THREADS: ${EPM_OCR_THREADS:-2}
      EPM_OCR_MODUS: ${EPM_OCR_MODUS:-auto}
      EPM_VERSION: ${EPM_VERSION}
      TZ: Europe/Berlin
    secrets: [db_password, django_secret_key]
    volumes:
      - ./data/scans:/data/scans
    networks: [intern]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Obergrenze für den Speicher (in .env änderbar); die Rechenzeit begrenzen niedrige Priorität (nice) und
    # EPM_OCR_THREADS – eine feste CPU-Grenze würde auf Servern mit weniger Kernen den Start verhindern
    mem_limit: ${EPM_OCR_SPEICHER:-3g}
    # kein zusätzlicher Swap: Reicht der Speicher nicht, bricht der Dienst sofort ab (die Seite wird dann sparsamer
    # erkannt) – statt die ganze VM ins Auslagern zu treiben (Test-VM 09.10.2026: Swap voll, alles langsam)
    memswap_limit: ${EPM_OCR_SPEICHER:-3g}
    healthcheck:
      # der Dienst berührt die Datei bei jedem Durchlauf (zwischen zwei Seiten höchstens wenige Minuten)
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/epm-ocr-lebt') < 900 else 1)"]
      interval: 60s
      timeout: 5s
      start_period: 120s
      retries: 3

  web:
    # Nginx mit dem gebauten Frontend (frontend/Dockerfile); Konfiguration und Zertifikat vom Server
    image: epm-web:${EPM_VERSION}
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${EPM_BIND_IP}:443:8443"        # nur an die Verwaltungs-IP gebunden
    volumes:
      - ./nginx/epm.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./data/dokumente:/data/dokumente:ro
      # bereitgestellte Sicherungen: Nginx liefert sie aus, nachdem Django Recht und Sitzung geprüft hat
      - ./system/download:/data/sicherung-download:ro
      - static:/srv/static:ro
    networks: [intern, extern]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  intern:
    internal: true      # kein Weg nach außen für db und backend
  extern: {}

volumes:
  db-data:
  static:

secrets:
  db_password:
    file: ./secrets/db_password
  django_secret_key:
    file: ./secrets/django_secret_key
