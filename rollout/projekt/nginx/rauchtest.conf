server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/epm.crt;
    ssl_certificate_key /etc/nginx/certs/epm.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    server_tokens off;

    location / {
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>EPM Test</title><h1>EPM-Testserver l&auml;uft</h1><p>TLS, Firewall und Docker sind in Ordnung.</p>';
    }
}
