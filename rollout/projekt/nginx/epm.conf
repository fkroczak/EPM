# EPM – Nginx im Betrieb: TLS, Frontend, API-Weiterleitung, geschützte Dokumente
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/epm.crt;
    ssl_certificate_key /etc/nginx/certs/epm.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TLS:5m;

    server_tokens off;
    client_max_body_size 55m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;  # Mikrofon für Diktate (nur eigene Seite)
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Wartungsseite (Selbstheilung, 13.10.2026): Antwortet das Backend nicht (Neustart, Update, Rückfall auf die gute
    # Version), bekommt der Browser statt der nackten Nginx-Fehlerseite eine deutsche Seite, die sich alle 30 s neu lädt;
    # Anfragen an /api/ bekommen JSON mit „fehler“, das die Oberfläche als Meldung anzeigt (lib/api.ts).
    error_page 502 503 504 @wartung;
    location @wartung {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 30 always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        if ($request_uri ~ ^/api/) {
            return 503 '{"fehler": "EPM startet gerade neu – bitte in einer Minute erneut versuchen. Eingaben bleiben im Formular stehen."}';
        }
        root /srv/web;
        try_files /wartung.html =503;
    }

    # Anwendung (Django)
    location ~ ^/(api|verwaltung)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # Stammzertifikat der eigenen CA zum Installieren auf PC und Telefon (öffentlich, ohne Schlüssel; Passkeys,
    # Festlegung 08.10.2026). Fehlt die Datei (selbst signiertes Zertifikat), antwortet Nginx mit 204 ohne Inhalt:
    # Mein Konto und die Anmeldeseite fragen bei jedem Aufruf nach – ein 404 stand sonst jedes Mal als Fehler in der
    # Konsole des Browsers (Browsertest audit-firmen, 15.11.2026).
    location = /epm-ca.crt {
        alias /etc/nginx/certs/epm-ca.crt;
        error_page 404 = @ohne_stammzertifikat;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="epm-ca.crt"' always;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location @ohne_stammzertifikat {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 204;
    }
    # dasselbe als Profil für iPhone und iPad (schreibt epm-zertifikat bei jedem Einrichten/Erneuern/Importieren)
    location = /epm-ca.mobileconfig {
        alias /etc/nginx/certs/epm-ca.mobileconfig;
        default_type application/x-apple-aspen-config;
        add_header Content-Disposition 'attachment; filename="EPM-Stammzertifikat.mobileconfig"' always;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Statische Dateien von Django (Admin, API-Ansicht)
    location /static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
    }

    # Patientendokumente: nur nach Prüfung durch Django (X-Accel-Redirect)
    location /_geschuetzt/dokumente/ {
        internal;
        alias /data/dokumente/;
        # Eigene add_header heben die des Servers auf (Nginx erbt sie dann nicht) – die Sicherheitsköpfe deshalb hier
        # wiederholen (Sicherheitsprüfung 11.10.2026). SAMEORIGIN statt DENY: Textdokumente zeigt die Akte im Rahmen.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        # Nach X-Accel-Redirect gibt nginx eigene Köpfe von Django nicht weiter: Prüfergebnis der Plan-PDF durchreichen
        add_header X-EPM-Pruefung $upstream_http_x_epm_pruefung always;
        add_header X-EPM-Vorlage-Version $upstream_http_x_epm_vorlage_version always;
    }

    # Bereitgestellte Sicherungen (Administration › Backup › Herunterladen): nur nach Prüfung durch Django
    location /_geschuetzt/sicherung/ {
        internal;
        alias /data/sicherung-download/;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Frontend (Image epm-web): Dateien mit Prüfsumme im Namen lange zwischenspeichern, index.html nie.
    # Komprimiert nur hier (Lighthouse 09.10.2026: das Startpaket ging unkomprimiert übers Netz) – nicht für /api/, damit
    # Antworten mit Daten nicht für BREACH angreifbar werden. Schriften (woff2) und Bilder sind schon komprimiert.
    location /assets/ {
        root /srv/web;
        expires 1y;
        access_log off;
        gzip on;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript image/svg+xml;
    }
    # Bilder der Hilfe (Wunsch 11.10.2026, frontend/public/hilfe-bilder/): fehlt eine Datei, 404 statt der App-Seite
    # (sonst käme index.html als „Bild“ zurück). Namen ohne Prüfsumme → nur einen Tag zwischenspeichern, damit neue
    # Bilder nach einem Update bald ankommen. PNG/GIF sind schon komprimiert.
    location /hilfe-bilder/ {
        root /srv/web;
        try_files $uri =404;
        expires 1d;
        access_log off;
    }
    location / {
        root /srv/web;
        try_files $uri /index.html;
        expires -1;
        gzip on;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript image/svg+xml application/json text/plain;
    }
}
